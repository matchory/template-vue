name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Style wiring
            run: pnpm run style:verify
          - name: Formatting
            run: pnpm run fmt:check
          - name: Lint
            run: pnpm run lint:ci
          - name: Types
            run: pnpm run check
          - name: Tests
            run: pnpm test
          - name: Build
            run: pnpm run build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  pinned-actions:
    name: Actions are pinned to commit SHAs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check every `uses:` is a 40-character SHA
        run: |
          status=0

          while IFS= read -r line; do
            reference="${line#*uses:}"
            reference="$(printf '%s' "${reference}" | tr -d ' ' | cut -d'#' -f1)"

            case "${reference}" in
              ./*|docker://*) continue ;;
            esac

            version="${reference##*@}"

            if ! printf '%s' "${version}" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::unpinned action: ${reference}"
              status=1
            fi
          done < <(grep -rhE '^\s*-?\s*uses:' .github/)

          if [ "${status}" -eq 0 ]; then
            echo "All actions are pinned to commit SHAs"
          fi

          exit "${status}"
